<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex">
  <title>Thank You | Sheryl V.</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      font-family: Arial, sans-serif;
      background: #F8F7FF;
      color: #172554;
    }

    .thank-you-card {
      width: 100%;
      max-width: 560px;
      padding: 48px 32px;
      background: #FFFFFF;
      border-radius: 20px;
      text-align: center;
      box-shadow: 0 12px 40px rgba(23, 37, 84, 0.10);
    }

    .checkmark {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 72px;
      height: 72px;
      border-radius: 50%;
      background: #E0F7FA;
      color: #0891B2;
      font-size: 38px;
      margin-bottom: 24px;
    }

    h1 {
      font-size: clamp(26px, 5vw, 36px);
      margin: 0 0 16px;
    }

    p {
      font-size: 16px;
      line-height: 1.7;
      color: #475569;
      margin-bottom: 28px;
    }

    .back-button {
      display: inline-block;
      padding: 14px 28px;
      border-radius: 10px;
      background: #172554;
      color: #FFFFFF;
      text-decoration: none;
      font-weight: 600;
    }

    .back-button:hover {
      background: #0891B2;
    }
  </style>
</head>

<body>
  <main class="thank-you-card">
    <div class="checkmark" aria-hidden="true">✓</div>

    <h1>Thank You for Reaching Out!</h1>

    <p>
      Your inquiry has been successfully submitted.
      I will review your message and get back
      to you as soon as possible.
      <br><br>
      Looking forward to connecting with you!
    </p>

    <a href="./" class="back-button">
      Back to Portfolio
    </a>
  </main>
</body>
</html>
